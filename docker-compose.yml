version: '3.8'

services:
  # PostgreSQL Databases
  postgres:
    image: postgres:15-alpine
    container_name: innovalogix_postgres
    environment:
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: innovalogix_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - CRM_SERVICE_URL=http://crm-service:3002
      - PURCHASES_SERVICE_URL=http://purchases-service:3003
      - POS_SERVICE_URL=http://pos-service:3004
      - REPORTS_SERVICE_URL=http://reports-service:3005
    depends_on:
      - inventory-service
      - crm-service
      - purchases-service
      - pos-service
      - reports-service

  # Inventory Service
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: innovalogix_inventory
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_DATABASE=inventory_db
      - DB_PASSWORD=admin123
      - DB_PORT=5432
      - SERVICE_NAME=inventory-service
    depends_on:
      postgres:
        condition: service_healthy

  # CRM Service
  crm-service:
    build:
      context: ./services/crm-service
      dockerfile: Dockerfile
    container_name: innovalogix_crm
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_DATABASE=crm_db
      - DB_PASSWORD=admin123
      - DB_PORT=5432
      - SERVICE_NAME=crm-service
    depends_on:
      postgres:
        condition: service_healthy

  # Purchases Service
  purchases-service:
    build:
      context: ./services/purchases-service
      dockerfile: Dockerfile
    container_name: innovalogix_purchases
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_DATABASE=purchases_db
      - DB_PASSWORD=admin123
      - DB_PORT=5432
      - SERVICE_NAME=purchases-service
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
    depends_on:
      postgres:
        condition: service_healthy

  # POS Service
  pos-service:
    build:
      context: ./services/pos-service
      dockerfile: Dockerfile
    container_name: innovalogix_pos
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DB_USER=postgres
      - DB_HOST=postgres
      - DB_DATABASE=pos_db
      - DB_PASSWORD=admin123
      - DB_PORT=5432
      - SERVICE_NAME=pos-service
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - CRM_SERVICE_URL=http://crm-service:3002
    depends_on:
      postgres:
        condition: service_healthy

  # Reports Service
  reports-service:
    build:
      context: ./services/reports-service
      dockerfile: Dockerfile
    container_name: innovalogix_reports
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - SERVICE_NAME=reports-service
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - CRM_SERVICE_URL=http://crm-service:3002
      - PURCHASES_SERVICE_URL=http://purchases-service:3003
      - POS_SERVICE_URL=http://pos-service:3004

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: innovalogix_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - gateway

volumes:
  postgres_data:

networks:
  default:
    name: innovalogix_network
